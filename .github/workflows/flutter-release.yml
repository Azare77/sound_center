name: Flutter Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # اجازه دسترسی به کد و ساخت Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      - name: Flutter Doctor Licences
        run: yes | flutter doctor --android-licenses

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=$(pwd)/android/app/release.jks" >> android/key.properties

      - name: Set PUB_CACHE inside workspace
        run: echo "PUB_CACHE=$GITHUB_WORKSPACE/.pub-cache" >> $GITHUB_ENV

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Match F-Droid SDK Path
        run: |
          sudo mkdir -p /opt/android-sdk
          sudo chown -R $USER:$USER /opt/android-sdk
          # Symlink the default GH SDK to the F-Droid path
          ln -s $ANDROID_HOME/* /opt/android-sdk/
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload Release APK
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
