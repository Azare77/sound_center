name: Manual Flutter Test & Build

on:
  workflow_dispatch:

jobs:
  flutter-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Doctor Licences
        run: yes | flutter doctor --android-licenses

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter pub get

      - name: Patch fdroid
        run: sed -i '2i add_link_options("LINKER:--build-id=none")' "$CMAKE_FILE"

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Remove build folder
        run: rm -rf build/
